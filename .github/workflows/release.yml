name: release

# Publishes a release when a version tag such as v0.2.0 is pushed:
#   - the .NET global tool package, attached to a GitHub Release
#   - the Docker image, pushed to GitHub Container Registry
#   - the package on nuget.org, only if the NUGET_API_KEY secret is configured

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Read version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          dotnet restore CodeSentinel.sln
          dotnet build CodeSentinel.sln --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }}
          dotnet test CodeSentinel.sln --no-build --configuration Release

  package:
    name: package
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack the global tool
        run: dotnet pack src/CodeSentinel.Cli --configuration Release -p:Version=${{ needs.verify.outputs.version }}

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          artifacts/nupkg/*.nupkg
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag

      - name: Publish to nuget.org
        if: env.NUGET_API_KEY != ''
        run: >
          dotnet nuget push "artifacts/nupkg/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  image:
    name: image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Registry paths must be lowercase; the account name is not.
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/codesentinel" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ needs.verify.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
