name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CodeSentinel.sln

      - name: Build
        run: dotnet build CodeSentinel.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test CodeSentinel.sln --no-build --configuration Release --verbosity normal

  package:
    name: package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack the global tools
        run: |
          dotnet pack src/CodeSentinel.Cli --configuration Release
          dotnet pack src/CodeSentinel.Mcp --configuration Release

      - name: Install and run the packed tool
        run: |
          dotnet tool install --global --add-source ./artifacts/nupkg CodeSentinel.Cli
          codesentinel --version

      # The server answers initialize over stdio. stdin stays open for a few seconds
      # so the reply is written before end of input shuts the server down, and any
      # line on stdout that is not JSON fails the step.
      - name: Install and start the packed MCP server
        run: |
          dotnet tool install --global --add-source ./artifacts/nupkg CodeSentinel.Mcp
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          response=$( { printf '%s\n' "$request"; sleep 5; } | timeout 30 codesentinel-mcp --allowed-root "$PWD" )
          echo "$response"
          if printf '%s\n' "$response" | grep -v '^{' | grep -q .; then
            echo "codesentinel-mcp wrote something other than JSON-RPC to stdout"
            exit 1
          fi
          printf '%s\n' "$response" | grep -q '"serverInfo":{"name":"codesentinel"'

      - name: Build the Docker image
        run: docker build --tag codesentinel:ci .

      - name: Scan this repository from the container
        run: docker run --rm -v "$PWD:/scan" codesentinel:ci /scan --fail-on High

      - name: Scan a remote repository from the container
        # Exit code 1 only means the remote repository has findings; 2 is a scan failure.
        run: |
          status=0
          docker run --rm codesentinel:ci https://github.com/octocat/Hello-World.git || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
